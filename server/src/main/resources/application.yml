spring:
  application.name: invoice-server
  datasource:
    # date_class=TEXT：Xerial JDBC 默认按 INTEGER (epoch ms) 存 timestamp，与读侧 ISO 解析
    # 错位导致 ParseException。强制 TEXT 模式，读写都用 ISO-8601。
    url: jdbc:sqlite:./data/invoice.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on&date_class=TEXT
    driver-class-name: org.sqlite.JDBC
  jpa:
    # SQLite 类型亲和（type affinity）非严格：INTEGER 与 BIGINT、TEXT 与 VARCHAR/TIMESTAMP
    # 在 validate 阶段频繁误报。schema.sql 已是单一事实源，列名错配会被运行时的 SQL
    # 异常直接捕获（"no such column"），代价是失去启动期校验。
    hibernate.ddl-auto: none
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: ./uploads
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-32bytes-or-more}
    expire-seconds: 86400   # 24h
  auth:
    rate-limit-enabled: true
    # 仅当后端确实在可信反向代理之后才置 true（nginx 会覆盖客户端 X-Real-IP）。
    # compose 里硬编码 true；yml 默认 false 给本地 dev 用。
    trust-proxy: false

# 这些配置（admin/llm）原本挂在 app.* 下，对应 env var 带 APP_ 前缀。env var
# 去前缀（ADMIN_USERNAME 等）后属性也搬到根，避免 Spring relaxed binding 错位。
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}
llm:
  base-url: ${LLM_BASE_URL:https://opencode.ai/zen/v1}
  api-key: ${LLM_API_KEY:sk-J7LGINZ7IRCh43z1ahN1j3OxN7n9zkoEeTX1LtMj4nD6hjt7ErvCiDyYUU09LjNl}
  model: ${LLM_MODEL:big-pickle}
  enabled: true
  timeout-seconds: 60
  
logging:
  file:
    name: ./logs/invoice-server.log
  level:
    root: INFO
    # com.example.invoice.service: DEBUG   # 调解析/LLM 日志时打开
    # org.hibernate.SQL: DEBUG             # 打印 SQL

server:
  port: 8080
  tomcat:
    # 413 时吞掉剩余请求体再写响应（默认 2MB 上限会中途 RST 连接），否则经 nginx 反代时
    # 浏览器收到 502 而非 GlobalExceptionHandler 的「文件超过 10MB 限制」提示
    max-swallow-size: -1
