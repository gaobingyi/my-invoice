spring:
  application.name: invoice-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/invoice_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: invoice_app
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload-dir: ./uploads
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-32bytes-or-more}
    expire-seconds: 86400   # 24h
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123}
  auth:
    rate-limit-enabled: true
    # 仅当后端确实在可信反向代理之后才置 true（nginx 会覆盖客户端 X-Real-IP）
    trust-proxy: ${APP_TRUST_PROXY:false}
  llm:
    base-url: https://opencode.ai/zen/v1
    model: big-pickle
    enabled: true
    timeout-seconds: 60
    api-key: ${LLM_API_KEY:}

logging:
  file:
    name: ./logs/invoice-server.log
  level:
    root: INFO
    # com.example.invoice.service: DEBUG   # 调解析/LLM 日志时打开
    # org.hibernate.SQL: DEBUG             # 打印 SQL

server:
  port: 8080
  tomcat:
    # 413 时吞掉剩余请求体再写响应（默认 2MB 上限会中途 RST 连接），否则经 nginx 反代时
    # 浏览器收到 502 而非 GlobalExceptionHandler 的「文件超过 10MB 限制」提示
    max-swallow-size: -1
