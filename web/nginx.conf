# 包含 Cloudflare IP 白名单及本地网段放行
include /etc/nginx/cf-allow.conf;

# 经 CF 代理时 $remote_addr 是边缘节点 IP——所有走同一 POP 的访客共享少数几个桶，
# 按 IP 的登录限流会被击穿（攻击者换 colo 即得新桶，正常用户反被共享限流）。
# 取 CF 注入的 CF-Connecting-IP 作真实客户端 IP（源站已限定仅 CF 网段可入，头可信）；
# 直连/cloudflared 隧道场景无此头，回退 $remote_addr。
map $http_cf_connecting_ip $client_real_ip {
    default $remote_addr;
    ~.+      $http_cf_connecting_ip;
}

# 兜底 default server：单一业务 server block 会隐式兼任 default server，
# 任何 SNI/Host（直连 IP 扫描、伪造 Host）都能命中它。显式接管 default：
# SNI 不是业务域名的直接拒握手，杜绝扫描器经 TLS 探测源站。
server {
    listen 8088 ssl default_server;
    server_name _;

    # 不需要证书：握手阶段即拒绝（nginx >= 1.19.4）
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 8088 ssl;
    http2 on;
    server_name invoice.bingyi.dpdns.org;

    # SNI 合法但 Host 头不对（只可能来自私网内直连——公网已被 cf-allow 拦在 IP 层）：
    # 兜底拒绝，防内网横向探测。if 仅含 return，无 "if is evil" 的副作用。
    if ($host != "invoice.bingyi.dpdns.org") {
        return 444;
    }

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cloudflare Authenticated Origin Pulls（Global 模式：信任 CF 公共 origin-pull CA
    # origin-pull.cloudflare.net，证书为本目录 cf-origin-pull-ca.pem）。
    # 无 client 证书的连接（直连/扫描，含私网与 127.0.0.1）一律 400——源站闸门从
    # IP 白名单升级为密码学验证。回滚 = 删除这两行 + reload。
    ssl_client_certificate /etc/nginx/certs/cf-origin-pull-ca.pem;
    ssl_verify_client on;

    server_tokens off;

    # 注意 nginx 的 add_header 继承规则：location 内一旦出现自己的 add_header，
    # server 级的头就不再继承 —— 所以下方两个静态 location 里重复了这组安全头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 前端主包（EP + vue）几百 KB，压缩后传输体积减 60~70%
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    client_max_body_size 20m;

    location /api/ {
        # 用变量 + resolver 让 backend 域名在每次请求时经 Docker 内置 DNS（127.0.0.11）
        # 重新解析：compose 只重建 backend 容器（IP 变化）而 nginx 未重启时，直接写死
        # proxy_pass http://backend:8080 会继续向旧 IP 转发 → 全站 502。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # 上传链路 = multipart 接收 + PDFBox 解析 + LLM 兜底（read timeout 60s，两次重试）
        # + 落库，总耗时可逼近分钟级。默认 proxy_read_timeout 60s 会让 nginx 先掐断回
        # 504，而后端仍在正常处理。
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        # Vite 产物文件名带内容 hash，内容变则 URL 变，可放心长缓存
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # 入口 HTML 必须每次回源校验：它引用带 hash 的资源 URL，缓存旧版会导致
        # 发版后浏览器继续跑旧 JS（表现：新解析的数据配旧渲染逻辑，字段显示不对）。
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
