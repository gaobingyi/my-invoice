# 包含 Cloudflare IP 白名单及本地网段放行
include /etc/nginx/cf-allow.conf;

# 经 CF 代理时 $remote_addr 是边缘节点 IP——所有走同一 POP 的访客共享少数几个桶，
# 按 IP 的登录限流会被击穿（攻击者换 colo 即得新桶，正常用户反被共享限流）。
# 取 CF 注入的 CF-Connecting-IP 作真实客户端 IP（源站已限定仅 CF 网段可入，头可信）；
# 直连/cloudflared 隧道场景无此头，回退 $remote_addr。
map $http_cf_connecting_ip $client_real_ip {
    default $remote_addr;
    ~.+      $http_cf_connecting_ip;
}

server {
    listen 8088 ssl;
    http2 on;
    server_name invoice.bingyi.dpdns.org;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        # Vite 产物文件名带内容 hash，内容变则 URL 变，可放心长缓存
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # 入口 HTML 必须每次回源校验：它引用带 hash 的资源 URL，缓存旧版会导致
        # 发版后浏览器继续跑旧 JS（表现：新解析的数据配旧渲染逻辑，字段显示不对）。
        add_header Cache-Control "no-cache";
    }
}
